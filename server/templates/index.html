<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>雀魂 牌譜ライブラリ</title>
    <!-- Google Fonts の読み込み -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+JP:wght@300;400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0e12;
            --card-bg: rgba(22, 24, 33, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-primary: #10b981;
            /* 緑 */
            --accent-glow: rgba(16, 185, 129, 0.3);
            --accent-purple: #8b5cf6;
            --font-display: 'Outfit', 'Noto Sans JP', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-display);
            min-height: 100vh;
            padding: 2rem;
            background-image:
                radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.1) 0px, transparent 50%);
        }

        header {
            max-width: 1200px;
            margin: 0 auto 3rem auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 1.5rem;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(to right, #10b981, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.05em;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 0.2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .record-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 1.5rem;
        }

        .record-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 1.5rem;
            backdrop-filter: blur(12px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .record-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(to right, var(--accent-primary), var(--accent-purple));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .record-card:hover {
            transform: translateY(-4px);
            border-color: rgba(16, 185, 129, 0.3);
            box-shadow: 0 12px 20px -8px var(--accent-glow);
        }

        .record-card:hover::before {
            opacity: 1;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .uuid-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-family: monospace;
        }

        .game-type {
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent-primary);
            padding: 0.25rem 0.6rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .players-list {
            margin-top: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 1rem;
        }

        .player-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .player-row:last-child {
            margin-bottom: 0;
        }

        .seat-badge {
            display: inline-block;
            width: 20px;
            height: 20px;
            line-height: 20px;
            text-align: center;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            margin-right: 0.5rem;
        }

        .seat-badge.east {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
        }

        .seat-badge.south {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
        }

        .seat-badge.west {
            background: rgba(245, 158, 11, 0.2);
            color: #fbbf24;
        }

        .seat-badge.north {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
        }

        .player-name {
            font-weight: 600;
            color: var(--text-main);
            flex-grow: 1;
            text-align: left;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .player-score {
            font-family: monospace;
            font-weight: bold;
            color: var(--text-muted);
        }

        .card-footer {
            margin-top: 1.2rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .no-records {
            grid-column: 1 / -1;
            text-align: center;
            padding: 5rem 2rem;
            background: var(--card-bg);
            border: 1px dashed var(--card-border);
            border-radius: 16px;
            color: var(--text-muted);
        }

        /* AI 総合評価 (S~C) バッジ (小さめ: プレイヤー名の横に表示) */
        .player-info {
            display: flex;
            align-items: center;
            gap: 4px;
            flex: 1;
            min-width: 0;
        }
        .player-info .player-name {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .grade-wrap {
            display: inline-flex;
            align-items: center;
            flex-shrink: 0;
        }
        .grade-mini {
            display: inline-block;
            min-width: 1.4rem;
            text-align: center;
            padding: 1px 5px;
            border-radius: 4px;
            font-size: 0.72rem;
            font-weight: bold;
            color: white;
            line-height: 1.3;
            cursor: help;
        }
        .grade-mini.grade-s { background: linear-gradient(135deg, #f59e0b, #ef4444); box-shadow: 0 0 6px rgba(245, 158, 11, 0.6); }
        .grade-mini.grade-a { background: linear-gradient(135deg, #3b82f6, #8b5cf6); }
        .grade-mini.grade-b { background: linear-gradient(135deg, #10b981, #059669); }
        .grade-mini.grade-c { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .grade-mini.grade-d { background: linear-gradient(135deg, #ef4444, #b91c1c); }
        .grade-mini.grade-e, .grade-mini.grade-pending { background: #6b7280; }

        /* AI評価中スピナー（タイトル付近用） */
        .eval-spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid rgba(139, 92, 246, 0.25);
            border-top-color: #a29bfe;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-left: 6px;
        }
        .eval-spinner.hidden { display: none; }
        .eval-spinner-text {
            display: inline-block;
            font-size: 0.7rem;
            color: #a29bfe;
            margin-left: 4px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* カードヘッダ用 S~C 集計バッジ */
        .header-grades {
            display: inline-flex;
            gap: 4px;
            margin-left: 8px;
            vertical-align: middle;
        }
        .grade-pill {
            display: inline-block;
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: bold;
            color: white;
            line-height: 1.3;
        }
        .grade-pill.grade-s { background: linear-gradient(135deg, #f59e0b, #ef4444); }
        .grade-pill.grade-a { background: linear-gradient(135deg, #3b82f6, #8b5cf6); }
        .grade-pill.grade-b { background: linear-gradient(135deg, #10b981, #059669); }
        .grade-pill.grade-c { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .grade-pill.grade-d { background: linear-gradient(135deg, #ef4444, #b91c1c); }
        .grade-pill.grade-e { background: #6b7280; }

        .new-record-toast {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            padding: 0.8rem 1.4rem;
            border-radius: 12px;
            font-weight: bold;
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4);
            opacity: 0;
            transform: translateY(-20px);
            transition: opacity 0.3s, transform 0.3s;
            z-index: 1000;
            pointer-events: none;
        }
        .new-record-toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .loader {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, .05);
            border-radius: 50%;
            border-top-color: var(--accent-primary);
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 1rem;
        }

        .restart-btn {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .restart-btn:hover {
            background: rgba(239, 68, 68, 0.2);
            border-color: #f87171;
        }

        .restart-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div id="newRecordToast" class="new-record-toast"></div>
    <header>
        <div>
            <h1>雀魂 牌譜ライブラリ</h1>
            <div class="subtitle">自動中継サーバーによってキャプチャされた対局データ一覧</div>
        </div>
        <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 6px;">
            <div style="display: flex; gap: 8px; align-items: center;">
                <button class="restart-btn" id="restartBtn" onclick="restartServer()">⟳ 再起動</button>
                <a href="/majsoul_hook.user.js" target="_blank" style="
                    background: rgba(16, 185, 129, 0.1);
                    border: 1px solid var(--accent-primary);
                    color: var(--accent-primary);
                    padding: 0.6rem 1.2rem;
                    border-radius: 8px;
                    font-size: 0.85rem;
                    font-weight: 600;
                    text-decoration: none;
                    transition: all 0.2s ease;
                    display: flex;
                    align-items: center;
                    gap: 6px;
                " onmouseover="this.style.background='rgba(16, 185, 129, 0.2)'"
                    onmouseout="this.style.background='rgba(16, 185, 129, 0.1)'">
                    🔧 Tampermonkey スクリプトを導入
                </a>
            </div>
            <div
                style="font-size: 0.7rem; color: var(--text-muted); opacity: 0.85; text-align: right; line-height: 1.4;">
                ※事前に拡張機能を導入してください (
                <a href="https://chromewebstore.google.com/detail/tampermonkey/dhdgffkkebhmkfjojejmpbldmpobfkfo?hl=ja"
                    target="_blank" style="color: var(--accent-purple); text-decoration: underline;">Chrome版</a> /
                <a href="https://microsoftedge.microsoft.com/addons/detail/tampermonkey/iikmkjmpaadaobahmlepknomcihgpkip"
                    target="_blank" style="color: var(--accent-purple); text-decoration: underline;">Edge版</a>
                )<br>
                <span style="color: var(--accent-primary);">※拡張機能設定 (chrome://extensions)
                    の「デベロッパーモード」をONにしてください。</span><br>
                <span style="color: var(--accent-primary);">※Vivaldi等をお使いの場合は、さらに詳細項目で「ユーザースクリプトを許可する」もONにしてください。</span>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="record-grid" id="recordGrid">
            <div class="no-records" id="loadingState">
                <div class="loader"></div>
                <p>牌譜データを読み込み中...</p>
            </div>
        </div>
    </div>

    <script>
        /**
         * 日時のフォーマット変換を行います。
         * @param {number} timestamp - エポック秒タイムスタンプ
         * @returns {string} フォーマットされた日付文字列
         */
        function formatDate(timestamp) {
            if (!timestamp) return '不明';
            const date = new Date(timestamp * 1000);
            return date.toLocaleString('ja-JP', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        /**
         * 牌譜一覧を取得して画面に描画します。
         * @param {boolean} force - true なら件数に関係なく再描画 (初期ロード用)
         */
        let _lastRecordCount = -1;
        let _lastRecordIds = '';
        let _lastEvalHash = '';
        async function loadRecords(force = false) {
            const grid = document.getElementById('recordGrid');
            const loading = document.getElementById('loadingState');

            try {
                const response = await fetch('/api/records');
                if (!response.ok) throw new Error('API呼び出しに失敗しました');

                const records = await response.json();

                // Why: 件数/UUID だけでなく評価ステータスも比較する。
                // 牌譜追加時は UUID リスト、eval 完了時は評価ステータスが変化するため検知できる。
                const ids = records.map(r => r.uuid).join('|');
                const evalHash = records.map(r => {
                    if (!r.evaluations) return 'pending';
                    return Object.entries(r.evaluations).map(([k, v]) => `${k}:${v.grade}:${v.avg_score}`).join('|');
                }).join('#');
                if (!force && _lastRecordCount === records.length && _lastRecordIds === ids && _lastEvalHash === evalHash) {
                    return;
                }
                const newCount = records.length - _lastRecordCount;
                const newEvals = records.filter(r => r.evaluations && (!force || true)).length;
                _lastRecordCount = records.length;
                _lastRecordIds = ids;
                _lastEvalHash = evalHash;

                if (records.length === 0) {
                    grid.innerHTML = `
                        <div class="no-records">
                            <p>保存された牌譜データがまだありません。牌譜を表示してデータを取得してください。</p>
                        </div>
                    `;
                    return;
                }

                // 読み込み表示をクリア
                grid.innerHTML = '';

                records.forEach(rec => {
                    const card = document.createElement('div');
                    card.className = 'record-card';
                    card.onclick = () => {
                        window.location.href = `/simulator_v2?uuid=${rec.uuid}`;
                    };

                    // 各席の情報をプレイヤー名とスコアで並べ替え
                    const seatClasses = ['east', 'south', 'west', 'north'];
                    const seatLabels = ['東', '南', '西', '北'];

                    let playersHtml = '';
                    if (rec.players && rec.players.length > 0) {
                        // 席順でソート (0, 1, 2, 3)
                        const sortedPlayers = [...rec.players].sort((a, b) => a.seat - b.seat);
                        sortedPlayers.forEach(p => {
                            const badgeClass = seatClasses[p.seat] || '';
                            const label = seatLabels[p.seat] || '';
                            // 評価グレード (あれば名前の横に表示)
                            const ev = (rec.evaluations || {})[String(p.seat)];
                            let gradeBadge = '';
                            if (ev && ev.count > 0) {
                                gradeBadge = `<span class="grade-mini grade-${ev.grade.toLowerCase()}" title="平均マッチスコア: ${ev.avg_score}">${ev.grade}</span>`;
                            } else if (rec.evaluations) {
                                // 評価中
                                gradeBadge = `<span class="grade-mini grade-pending" title="評価中">-</span>`;
                            }
                            playersHtml += `
                                <div class="player-row">
                                    <div class="player-info">
                                        <span class="seat-badge ${badgeClass}">${label}</span>
                                        <span class="player-name">${p.nickname}</span>
                                        <span class="grade-wrap">${gradeBadge}</span>
                                    </div>
                                    <span class="player-score">${p.score !== undefined ? p.score : ''}</span>
                                </div>
                            `;
                        });
                    } else {
                        playersHtml = '<p style="font-size: 0.8rem; color: var(--text-muted)">プレイヤー情報なし</p>';
                    }

                    const gameTypeStr = rec.category === 2 ? '四人戦' : '三人戦';

                    // カードヘッダに S~C の集計バッジを追加 (デバッグ/視認性のため)
                    let headerGradesHtml = '';
                    if (rec.evaluations) {
                        const evalList = Object.values(rec.evaluations).filter(e => e && e.count > 0);
                        if (evalList.length > 0) {
                            const gradeOrder = ['S', 'A', 'B', 'C', 'D', 'E'];
                            const gradeCount = {};
                            for (const e of evalList) {
                                gradeCount[e.grade] = (gradeCount[e.grade] || 0) + 1;
                            }
                            headerGradesHtml = '<div class="header-grades">';
                            for (const g of gradeOrder) {
                                if (gradeCount[g]) {
                                    headerGradesHtml += `<span class="grade-pill grade-${g.toLowerCase()}" title="${g}: ${gradeCount[g]}人">${g}×${gradeCount[g]}</span>`;
                                }
                            }
                            headerGradesHtml += '</div>';
                        }
                    }

                    // AI評価中フラグ: rec.evaluations が null なら未完了
                    const isEvalPending = !rec.evaluations;
                    const evalSpinnerHtml = isEvalPending
                        ? '<span class="eval-spinner" title="AI評価中"></span><span class="eval-spinner-text">AI評価中…</span>'
                        : '<span class="eval-spinner hidden"></span>';

                    card.innerHTML = `
                        <div class="card-header">
                            <div>
                                <span class="uuid-label">UUID: ${rec.uuid.slice(0, 15)}...</span>
                                ${evalSpinnerHtml}
                                ${headerGradesHtml}
                            </div>
                            <span class="game-type">${gameTypeStr}</span>
                        </div>
                        <div class="players-list">
                            ${playersHtml}
                        </div>
                        <div class="card-footer">
                            <span>対局日時: ${formatDate(rec.startTime)}</span>
                        </div>
                    `;
                    grid.appendChild(card);
                });

                // 新着通知 (更新があった場合のみ)
                if (newCount > 0 && _lastRecordCount > 0) {
                    showNewRecordNotification(newCount);
                } else if (newCount === 0 && _lastRecordCount > 0 && evalHash !== _lastEvalHash) {
                    // 既存牌譜の評価が完了した場合
                    showEvalCompleteNotification(records.length);
                }

            } catch (err) {
                console.error(err);
                grid.innerHTML = `
                    <div class="no-records">
                        <p style="color: #ef4444;">データの取得中にエラーが発生しました: ${err.message}</p>
                    </div>
                `;
            }
        }

        /**
         * 新着牌譜の通知を表示
         */
        function showNewRecordNotification(count) {
            const toast = document.getElementById('newRecordToast');
            if (!toast) return;
            toast.textContent = `🆕 新しい牌譜が ${count} 件追加されました`;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 4000);
        }

        /**
         * 評価完了通知を表示
         */
        function showEvalCompleteNotification(total) {
            const toast = document.getElementById('newRecordToast');
            if (!toast) return;
            toast.textContent = `📊 AI 評価が完了しました (合計 ${total} 件)`;
            toast.style.background = 'linear-gradient(135deg, #3b82f6, #8b5cf6)';
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
                toast.style.background = '';
            }, 4000);
        }

        async function restartServer() {
            const btn = document.getElementById('restartBtn');
            btn.disabled = true;
            btn.textContent = '⟳ 再起動中...';
            try {
                await fetch('/api/restart', { method: 'POST' });
                // サーバーが再起動するまで待ってからリロード
                const wait = (ms) => new Promise(r => setTimeout(r, ms));
                for (let i = 0; i < 30; i++) {
                    await wait(1000);
                    try {
                        const res = await fetch('/');
                        if (res.ok) { location.reload(); return; }
                    } catch (_) { }
                }
            } catch (_) { }
            btn.disabled = false;
            btn.textContent = '⟳ 再起動';
        }

        // 初期読み込み + 5 秒ごとの自動ポーリング
        window.addEventListener('DOMContentLoaded', () => {
            loadRecords(true);
            setInterval(() => loadRecords(false), 5000);
        });
    </script>
</body>

</html>

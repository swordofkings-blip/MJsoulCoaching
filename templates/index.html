<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雀魂 牌譜ライブラリ</title>
    <!-- Google Fonts の読み込み -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0e12;
            --card-bg: rgba(22, 24, 33, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-primary: #10b981; /* 緑 */
            --accent-glow: rgba(16, 185, 129, 0.3);
            --accent-purple: #8b5cf6;
            --font-display: 'Outfit', 'Noto Sans JP', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-display);
            min-height: 100vh;
            padding: 2rem;
            background-image: 
                radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.1) 0px, transparent 50%);
        }

        header {
            max-width: 1200px;
            margin: 0 auto 3rem auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 1.5rem;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(to right, #10b981, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.05em;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 0.2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .record-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 1.5rem;
        }

        .record-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 1.5rem;
            backdrop-filter: blur(12px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .record-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(to right, var(--accent-primary), var(--accent-purple));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .record-card:hover {
            transform: translateY(-4px);
            border-color: rgba(16, 185, 129, 0.3);
            box-shadow: 0 12px 20px -8px var(--accent-glow);
        }

        .record-card:hover::before {
            opacity: 1;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .uuid-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-family: monospace;
        }

        .game-type {
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent-primary);
            padding: 0.25rem 0.6rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .players-list {
            margin-top: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 1rem;
        }

        .player-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .player-row:last-child {
            margin-bottom: 0;
        }

        .seat-badge {
            display: inline-block;
            width: 20px;
            height: 20px;
            line-height: 20px;
            text-align: center;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            margin-right: 0.5rem;
        }

        .seat-badge.east { background: rgba(239, 68, 68, 0.2); color: #f87171; }
        .seat-badge.south { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
        .seat-badge.west { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
        .seat-badge.north { background: rgba(16, 185, 129, 0.2); color: #34d399; }

        .player-name {
            font-weight: 600;
            color: var(--text-main);
            flex-grow: 1;
            text-align: left;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .player-score {
            font-family: monospace;
            font-weight: bold;
            color: var(--text-muted);
        }

        .card-footer {
            margin-top: 1.2rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .no-records {
            grid-column: 1 / -1;
            text-align: center;
            padding: 5rem 2rem;
            background: var(--card-bg);
            border: 1px dashed var(--card-border);
            border-radius: 16px;
            color: var(--text-muted);
        }

        .loader {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,.05);
            border-radius: 50%;
            border-top-color: var(--accent-primary);
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <header>
        <div>
            <h1>雀魂 牌譜ライブラリ</h1>
            <div class="subtitle">自動中継サーバーによってキャプチャされた対局データ一覧</div>
        </div>
    </header>

    <div class="container">
        <div class="record-grid" id="recordGrid">
            <div class="no-records" id="loadingState">
                <div class="loader"></div>
                <p>牌譜データを読み込み中...</p>
            </div>
        </div>
    </div>

    <script>
        /**
         * 日時のフォーマット変換を行います。
         * @param {number} timestamp - エポック秒タイムスタンプ
         * @returns {string} フォーマットされた日付文字列
         */
        function formatDate(timestamp) {
            if (!timestamp) return '不明';
            const date = new Date(timestamp * 1000);
            return date.toLocaleString('ja-JP', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        /**
         * 牌譜一覧を取得して画面に描画します。
         */
        async function loadRecords() {
            const grid = document.getElementById('recordGrid');
            const loading = document.getElementById('loadingState');

            try {
                const response = await fetch('/api/records');
                if (!response.ok) throw new Error('API呼び出しに失敗しました');
                
                const records = await response.json();
                
                if (records.length === 0) {
                    grid.innerHTML = `
                        <div class="no-records">
                            <p>保存された牌譜データがまだありません。ゲームをプレイするか、牌譜を表示してデータを取得してください。</p>
                        </div>
                    `;
                    return;
                }

                // 読み込み表示をクリア
                grid.innerHTML = '';

                records.forEach(rec => {
                    const card = document.createElement('div');
                    card.className = 'record-card';
                    card.onclick = () => {
                        window.location.href = `/simulator?uuid=${rec.uuid}`;
                    };

                    // 各席の情報をプレイヤー名とスコアで並べ替え
                    const seatClasses = ['east', 'south', 'west', 'north'];
                    const seatLabels = ['東', '南', '西', '北'];
                    
                    let playersHtml = '';
                    if (rec.players && rec.players.length > 0) {
                        // 席順でソート (0, 1, 2, 3)
                        const sortedPlayers = [...rec.players].sort((a, b) => a.seat - b.seat);
                        sortedPlayers.forEach(p => {
                            const badgeClass = seatClasses[p.seat] || '';
                            const label = seatLabels[p.seat] || '';
                            playersHtml += `
                                <div class="player-row">
                                    <div>
                                        <span class="seat-badge ${badgeClass}">${label}</span>
                                        <span class="player-name">${p.nickname}</span>
                                    </div>
                                    <span class="player-score">${p.score !== undefined ? p.score : ''}</span>
                                </div>
                            `;
                        });
                    } else {
                        playersHtml = '<p style="font-size: 0.8rem; color: var(--text-muted)">プレイヤー情報なし</p>';
                    }

                    const gameTypeStr = rec.category === 2 ? '四人戦' : '三人戦';

                    card.innerHTML = `
                        <div class="card-header">
                            <span class="uuid-label">UUID: ${rec.uuid.slice(0, 15)}...</span>
                            <span class="game-type">${gameTypeStr}</span>
                        </div>
                        <div class="players-list">
                            ${playersHtml}
                        </div>
                        <div class="card-footer">
                            <span>対局日時: ${formatDate(rec.startTime)}</span>
                        </div>
                    `;
                    grid.appendChild(card);
                });

            } catch (err) {
                console.error(err);
                grid.innerHTML = `
                    <div class="no-records">
                        <p style="color: #ef4444;">データの取得中にエラーが発生しました: ${err.message}</p>
                    </div>
                `;
            }
        }

        // 読み込み実行
        window.addEventListener('DOMContentLoaded', loadRecords);
    </script>
</body>
</html>
